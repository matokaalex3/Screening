name: Jalankan Bot Degen Emas 24 Jam
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Biar bisa dinyalain manual pake tombol klik di HP

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install Bahan Bot
      run: pip install -r requirements.txt
    - name: Jalankan Mesin Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
      run: python bot.py
